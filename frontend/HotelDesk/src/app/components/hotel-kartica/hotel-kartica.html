<a class="kartica" [routerLink]="['/hoteli', hotel().id]" [queryParams]="upit()">
  <span class="red">
    <span class="zvezdice" [attr.aria-label]="hotel().brojZvezdica + ' zvezdice'">{{ zvezdice() }}</span>
    @if (hotel().prosecnaOcena != null) {
      <span class="ocena">{{ hotel().prosecnaOcena }}</span>
    }
  </span>
  <span class="naziv">{{ hotel().naziv }}</span>
  <span class="mesto">{{ hotel().adresa.ulica }}, {{ hotel().adresa.gradNaziv }}</span>
  <span class="red dno">
    <span class="opis-ocene">{{ opisOcene() }}</span>
    <span class="vise">Pogledaj sobe</span>
  </span>
</a>
