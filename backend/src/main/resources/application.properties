spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:hoteldesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:hoteldesk-dev-secret-promeniti-u-produkciji-2026}
app.jwt.trajanje-minuta=${JWT_TRAJANJE_MINUTA:1440}

app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

app.admin.email=${ADMIN_EMAIL:admin@hoteldesk.rs}
app.admin.password=${ADMIN_PASSWORD:}
